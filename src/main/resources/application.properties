spring.application.name=expenseTracker

# Database Connection (Reads the full URL from your Render environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# CRITICAL: Restrict pool size to prevent hitting the free tier 5-connection limit
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# Server Port Binding for Render (Crucial to prevent Render from killing the app)
server.port=${PORT:8080}

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

logging.level.org.springframework.security=DEBUG

# OAuth Client Secret
oauth2.client.secret=${OAUTH_CLIENT_SECRET:my-local-secret}

server.error.include-message=always
server.error.include-exception=true
server.error.include-stacktrace=always

# Trust Render's proxy headers to prevent protocol mismatch / redirect loops
server.forward-headers-strategy=framework

